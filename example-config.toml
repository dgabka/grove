roots = ["/Users/you/repos"]
max_depth = 3
# Use Nerd Font branch/tree markers for bare repositories and branch glyphs for linked worktrees.
nerd_fonts = true

[[presets]]
name = "default"

[[presets.windows]]
name = "pi"
[[presets.windows.panes]]
command = ["pi"]

[[presets.windows]]
name = "nvim"
[[presets.windows.panes]]
command = ["nvim", "-S"]

[[presets.windows]]
name = "shell"

# `grove refresh` creates these sessions on demand; it does not supervise them.
# `cwd` must be an absolute path to an existing directory.
[[defaults]]
name = "main"
cwd = "/Users/you"

[[defaults.windows]]
name = "editor"
[[defaults.windows.panes]]
# Commands are argv arrays, not shell command strings.
command = ["nvim"]

# Omitting panes creates a shell in this window.
[[defaults.windows]]
name = "shell"
