roots = ["/Users/you/repos"]
max_depth = 3
# Use Nerd Font branch/tree markers for bare repositories and branch glyphs for linked worktrees.
nerd_fonts = true

[[presets]]
name = "default"

[[presets.windows]]
name = "pi"
[[presets.windows.panes]]
command = ["pi"]

[[presets.windows]]
name = "nvim"
[[presets.windows.panes]]
command = ["nvim", "-S"]

[[presets.windows]]
name = "shell"
