[package]
name = "grove"
version = "0.3.1"
edition = "2024"
description = "tmux sessions for Git worktrees"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
walkdir = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
